<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Venom</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --accent-r: 255;
    --accent-g: 255;
    --accent-b: 255;
    --accent: rgb(var(--accent-r), var(--accent-g), var(--accent-b));
    --accent-dim: rgba(var(--accent-r), var(--accent-g), var(--accent-b), 0.12);
    --accent-mid: rgba(var(--accent-r), var(--accent-g), var(--accent-b), 0.35);
    --bg-panel:  rgba(10, 10, 14, 0.93);
    --bg-item:   rgba(255,255,255,0.03);
    --bg-hover:  rgba(255,255,255,0.07);
    --bg-active: rgba(var(--accent-r), var(--accent-g), var(--accent-b), 0.14);
    --border:    rgba(255,255,255,0.07);
    --text-primary:   #e8e8ec;
    --text-secondary: #8a8a9a;
    --text-dim:       #55556a;
    --success: #4ade80;
    --error:   #f87171;
    --info:    #60a5fa;
    --warn:    #fbbf24;
    --radius:  6px;
    --menu-x: 14.25vw;
    --menu-y: 21.5vh;
    --menu-scale: 1;
  }

  html, body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }

  /* ── ROOT WRAPPER ── */
  #root {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }

  /* ══════════════════════════════════════════
     MAIN MENU
  ══════════════════════════════════════════ */
  #menu-wrap {
    position: absolute;
    top: var(--menu-y);
    left: var(--menu-x);
    width: 270px;
    display: none;
    flex-direction: column;
    pointer-events: all;
    transform-origin: top left;
    transform: scale(var(--menu-scale));
    user-select: none;
  }
  #menu-wrap.visible { display: flex; }

  /* ── HEADER ── */
  #menu-header {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-bottom: 2px solid var(--accent);
    border-radius: var(--radius) var(--radius) 0 0;
    padding: 10px 14px 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  #menu-title {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
  }
  #menu-auth {
    font-size: 10px;
    color: var(--text-dim);
    font-weight: 500;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  /* ── BREADCRUMB ── */
  #menu-breadcrumb {
    background: rgba(10,10,14,0.85);
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
    padding: 5px 14px;
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.06em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: none;
  }
  #menu-breadcrumb.visible { display: block; }

  /* ── TABS ── */
  #menu-tabs {
    display: none;
    background: rgba(10,10,14,0.9);
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    padding: 4px 8px;
    gap: 4px;
    flex-wrap: nowrap;
    overflow-x: auto;
  }
  #menu-tabs.visible { display: flex; }
  #menu-tabs::-webkit-scrollbar { height: 2px; }
  #menu-tabs::-webkit-scrollbar-thumb { background: var(--accent-mid); border-radius: 2px; }
  .tab-btn {
    flex-shrink: 0;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--text-dim);
    padding: 4px 10px;
    border-radius: 4px;
    border: 1px solid transparent;
    background: transparent;
    cursor: default;
    transition: color .15s, border-color .15s, background .15s;
  }
  .tab-btn.active {
    color: var(--accent);
    border-color: var(--accent-mid);
    background: var(--accent-dim);
  }

  /* ── ITEM LIST ── */
  #menu-list {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-top: none;
    border-radius: 0 0 var(--radius) var(--radius);
    overflow: hidden;
    max-height: 56vh;
    overflow-y: auto;
  }
  #menu-list::-webkit-scrollbar { width: 3px; }
  #menu-list::-webkit-scrollbar-thumb { background: var(--accent-mid); border-radius: 2px; }

  /* ── ITEM BASE ── */
  .menu-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 14px;
    min-height: 36px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-item);
    position: relative;
    transition: background .1s;
  }
  .menu-item:last-child { border-bottom: none; }
  .menu-item.is-active {
    background: var(--bg-active);
  }
  .menu-item.is-active::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 2px;
    background: var(--accent);
    border-radius: 0 2px 2px 0;
  }
  .menu-item.disabled { opacity: 0.38; pointer-events: none; }

  /* ── ITEM ICON ── */
  .item-icon {
    width: 16px;
    text-align: center;
    font-size: 13px;
    color: var(--text-secondary);
    flex-shrink: 0;
  }
  .menu-item.is-active .item-icon { color: var(--accent); }

  /* ── ITEM LABEL + DESC ── */
  .item-body { flex: 1; min-width: 0; }
  .item-label {
    font-size: 12px;
    font-weight: 500;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.3;
  }
  .menu-item.is-active .item-label { color: var(--accent); }
  .item-desc {
    font-size: 10px;
    color: var(--text-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 1px;
    line-height: 1.2;
  }

  /* ── ITEM RIGHT SIDE ── */
  .item-right {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }

  /* ── CHEVRON (submenu) ── */
  .item-chevron {
    font-size: 10px;
    color: var(--text-dim);
    transition: color .1s;
  }
  .menu-item.is-active .item-chevron { color: var(--accent); }

  /* ── CHECKBOX ── */
  .item-checkbox {
    width: 14px; height: 14px;
    border-radius: 3px;
    border: 1px solid var(--text-dim);
    background: transparent;
    display: flex; align-items: center; justify-content: center;
    transition: border-color .1s, background .1s;
    flex-shrink: 0;
  }
  .item-checkbox.checked {
    border-color: var(--accent);
    background: var(--accent-dim);
  }
  .item-checkbox.checked::after {
    content: '';
    width: 6px; height: 4px;
    border-left: 1.5px solid var(--accent);
    border-bottom: 1.5px solid var(--accent);
    transform: rotate(-45deg) translateY(-1px);
  }

  /* ── SLIDER ── */
  .item-slider-wrap {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .item-slider-val {
    font-size: 10px;
    font-weight: 600;
    color: var(--accent);
    min-width: 28px;
    text-align: right;
  }
  .item-slider-bar {
    width: 60px; height: 3px;
    background: var(--border);
    border-radius: 2px;
    position: relative;
    overflow: visible;
  }
  .item-slider-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width .1s;
  }

  /* ── SCROLL ── */
  .item-scroll-wrap {
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .item-scroll-arrow {
    font-size: 9px;
    color: var(--text-dim);
  }
  .menu-item.is-active .item-scroll-arrow { color: var(--accent); }
  .item-scroll-val {
    font-size: 10px;
    color: var(--text-secondary);
    max-width: 80px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-align: center;
  }
  .menu-item.is-active .item-scroll-val { color: var(--accent); }

  /* ── DIVIDER ── */
  .menu-divider {
    padding: 5px 14px 4px;
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(0,0,0,0.3);
    border-bottom: 1px solid var(--border);
  }
  .divider-line {
    flex: 1;
    height: 1px;
    background: var(--border);
  }
  .divider-label {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-dim);
    white-space: nowrap;
  }

  /* ── FOOTER HINT ── */
  #menu-footer {
    background: rgba(10,10,14,0.9);
    border: 1px solid var(--border);
    border-top: none;
    border-radius: 0 0 var(--radius) var(--radius);
    padding: 5px 14px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  .hint {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 9px;
    color: var(--text-dim);
    letter-spacing: 0.04em;
  }
  .hint-key {
    font-size: 8px;
    font-weight: 700;
    color: var(--text-secondary);
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 1px 4px;
    line-height: 1.4;
  }

  /* ══════════════════════════════════════════
     INPUT OVERLAY
  ══════════════════════════════════════════ */
  #input-wrap {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(3px);
    pointer-events: all;
    z-index: 100;
  }
  #input-wrap.visible { display: flex; }
  #input-box {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-top: 2px solid var(--accent);
    border-radius: var(--radius);
    width: 340px;
    padding: 20px 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  #input-title {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
  }
  #input-field-wrap {
    position: relative;
  }
  #input-field {
    width: 100%;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text-primary);
    font-size: 13px;
    padding: 8px 10px;
    outline: none;
    font-family: inherit;
    caret-color: var(--accent);
    transition: border-color .15s;
  }
  #input-field:focus { border-color: var(--accent-mid); }
  #input-hint {
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.04em;
  }

  /* ══════════════════════════════════════════
     NOTIFICATIONS
  ══════════════════════════════════════════ */
  #notify-wrap {
    position: fixed;
    bottom: 28px;
    right: 22px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 200;
    pointer-events: none;
  }
  .notify {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 9px 14px;
    min-width: 200px;
    max-width: 360px;
    animation: notifyIn .2s ease;
    transition: opacity .3s, transform .3s;
  }
  .notify.out { opacity: 0; transform: translateX(12px); }
  .notify-bar {
    width: 3px;
    height: 100%;
    border-radius: 2px;
    flex-shrink: 0;
    align-self: stretch;
  }
  .notify.success .notify-bar { background: var(--success); }
  .notify.error   .notify-bar { background: var(--error); }
  .notify.info    .notify-bar { background: var(--info); }
  .notify.warn    .notify-bar { background: var(--warn); }
  .notify-icon {
    font-size: 13px;
    flex-shrink: 0;
  }
  .notify.success .notify-icon { color: var(--success); }
  .notify.error   .notify-icon { color: var(--error); }
  .notify.info    .notify-icon { color: var(--info); }
  .notify.warn    .notify-icon { color: var(--warn); }
  .notify-text {
    font-size: 11px;
    color: var(--text-primary);
    line-height: 1.4;
    word-break: break-word;
  }

  @keyframes notifyIn {
    from { opacity: 0; transform: translateX(14px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  /* ══════════════════════════════════════════
     KEYBIND LIST PANEL
  ══════════════════════════════════════════ */
  #keybind-panel {
    position: fixed;
    top: var(--menu-y);
    left: calc(var(--menu-x) + 280px);
    width: 200px;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    display: none;
    flex-direction: column;
    pointer-events: all;
    z-index: 50;
  }
  #keybind-panel.visible { display: flex; }
  #keybind-header {
    padding: 8px 12px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
    border-bottom: 1px solid var(--border);
  }
  #keybind-list { overflow-y: auto; max-height: 200px; }
  .keybind-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 12px;
    border-bottom: 1px solid var(--border);
    gap: 8px;
  }
  .keybind-row:last-child { border-bottom: none; }
  .keybind-label { font-size: 10px; color: var(--text-secondary); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .keybind-key {
    font-size: 9px; font-weight: 700;
    color: var(--accent);
    background: var(--accent-dim);
    border: 1px solid var(--accent-mid);
    border-radius: 3px;
    padding: 2px 6px;
  }

  /* ══════════════════════════════════════════
     SPECTATOR PANEL
  ══════════════════════════════════════════ */
  #spec-panel {
    position: fixed;
    bottom: 60px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-top: 2px solid var(--error);
    border-radius: var(--radius);
    padding: 10px 18px;
    display: none;
    flex-direction: column;
    gap: 6px;
    pointer-events: none;
    z-index: 150;
    min-width: 200px;
    max-width: 340px;
  }
  #spec-panel.visible { display: flex; }
  #spec-title {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--error);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .spec-row {
    font-size: 11px;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .spec-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--error);
    flex-shrink: 0;
    animation: pulse 1.4s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
</style>
</head>
<body>
<div id="root">

  <!-- ══ MAIN MENU ══ -->
  <div id="menu-wrap">
    <div id="menu-header">
      <span id="menu-title">Venom</span>
      <span id="menu-auth"></span>
    </div>
    <div id="menu-breadcrumb"></div>
    <div id="menu-tabs"></div>
    <div id="menu-list"></div>
    <div id="menu-footer">
      <span class="hint"><span class="hint-key">↑↓</span> Navigate</span>
      <span class="hint"><span class="hint-key">Enter</span> Select</span>
      <span class="hint"><span class="hint-key">←→</span> Value</span>
      <span class="hint"><span class="hint-key">Bksp</span> Back</span>
    </div>
  </div>

  <!-- ══ INPUT OVERLAY ══ -->
  <div id="input-wrap">
    <div id="input-box">
      <div id="input-title">Input</div>
      <div id="input-field-wrap">
        <input id="input-field" type="text" autocomplete="off" spellcheck="false" readonly />
      </div>
      <div id="input-hint">Press <strong>Enter</strong> to confirm · <strong>Esc</strong> to cancel</div>
    </div>
  </div>

  <!-- ══ NOTIFICATIONS ══ -->
  <div id="notify-wrap"></div>

  <!-- ══ KEYBIND PANEL ══ -->
  <div id="keybind-panel">
    <div id="keybind-header">Keybinds</div>
    <div id="keybind-list"></div>
  </div>

  <!-- ══ SPECTATOR ALERT ══ -->
  <div id="spec-panel">
    <div id="spec-title"><i class="fa fa-eye"></i> Spectators Detected</div>
    <div id="spec-list"></div>
  </div>

</div>

<script>
'use strict';

// ══════════════════════════════════════════
// STATE
// ══════════════════════════════════════════
let state = {
  menu: [],
  current: 1,
  tabs: [],
  tabIndex: 0,
  visible: false,
  breadcrumb: [],
  color: { r: 255, g: 255, b: 255 },
  authName: '',
  keybinds: [],
  spectators: [],
  showSpecPanel: false,
  menuX: 14.25,
  menuY: 21.5,
  menuScale: 110,
};

// ══════════════════════════════════════════
// ELEMENTS
// ══════════════════════════════════════════
const menuWrap     = document.getElementById('menu-wrap');
const menuList     = document.getElementById('menu-list');
const menuBreadcrumb = document.getElementById('menu-breadcrumb');
const menuTabs     = document.getElementById('menu-tabs');
const menuAuth     = document.getElementById('menu-auth');
const inputWrap    = document.getElementById('input-wrap');
const inputTitle   = document.getElementById('input-title');
const inputField   = document.getElementById('input-field');
const notifyWrap   = document.getElementById('notify-wrap');
const keybindPanel = document.getElementById('keybind-panel');
const keybindList  = document.getElementById('keybind-list');
const specPanel    = document.getElementById('spec-panel');
const specList     = document.getElementById('spec-list');

// ══════════════════════════════════════════
// CSS VAR HELPERS
// ══════════════════════════════════════════
function setAccent(r, g, b) {
  const root = document.documentElement;
  root.style.setProperty('--accent-r', r);
  root.style.setProperty('--accent-g', g);
  root.style.setProperty('--accent-b', b);
}

function setMenuPos(x, y) {
  menuWrap.style.left  = x + 'vw';
  menuWrap.style.top   = y + 'vh';
}

function setMenuScale(scale) {
  const s = scale / 100;
  menuWrap.style.transform = `scale(${s})`;
}

// ══════════════════════════════════════════
// RENDER
// ══════════════════════════════════════════
function icon(cls) {
  if (!cls) return '';
  // Support "ph ph-skull" style or "fa-*" style
  return `<i class="${cls}" aria-hidden="true"></i>`;
}

function renderMenu() {
  menuList.innerHTML = '';
  const items = state.menu;
  if (!items || items.length === 0) return;

  for (let i = 0; i < items.length; i++) {
    const item = items[i];
    if (!item) continue;

    const idx = i + 1; // 1-based like Lua
    const isActive = idx === state.current;

    if (item.type === 'divider') {
      const div = document.createElement('div');
      div.className = 'menu-divider';
      div.innerHTML = `
        <div class="divider-line"></div>
        <span class="divider-label">${escHtml(item.label || '')}</span>
        <div class="divider-line"></div>
      `;
      menuList.appendChild(div);
      continue;
    }

    const el = document.createElement('div');
    el.className = 'menu-item' + (isActive ? ' is-active' : '') + (item.disabled ? ' disabled' : '');
    el.dataset.index = idx;

    // Icon
    const hasIcon = item.icon;
    const iconHtml = hasIcon ? `<span class="item-icon">${icon(item.icon)}</span>` : '';

    // Right side based on type
    let rightHtml = '';
    const t = item.type;

    if (t === 'submenu') {
      rightHtml = `<span class="item-chevron"><i class="fa fa-chevron-right"></i></span>`;
    } else if (t === 'checkbox') {
      const checked = item.checked ? ' checked' : '';
      rightHtml = `<span class="item-checkbox${checked}"></span>`;
    } else if (t === 'slider') {
      const min = item.min || 0, max = item.max || 100, val = item.value || 0;
      const pct = Math.round(((val - min) / (max - min)) * 100);
      rightHtml = `
        <div class="item-slider-wrap">
          <span class="item-scroll-arrow"><i class="fa fa-chevron-left"></i></span>
          <div class="item-slider-bar"><div class="item-slider-fill" style="width:${pct}%"></div></div>
          <span class="item-scroll-arrow"><i class="fa fa-chevron-right"></i></span>
          <span class="item-slider-val">${val}</span>
        </div>`;
    } else if (t === 'scroll') {
      const opts = item.options || [];
      const selIdx = Math.max(0, (item.selected || 1) - 1);
      const selLabel = opts[selIdx] ? (opts[selIdx].label || opts[selIdx]) : '';
      rightHtml = `
        <div class="item-scroll-wrap">
          <span class="item-scroll-arrow"><i class="fa fa-chevron-left"></i></span>
          <span class="item-scroll-val">${escHtml(String(selLabel))}</span>
          <span class="item-scroll-arrow"><i class="fa fa-chevron-right"></i></span>
        </div>`;
    } else if (Array.isArray(t)) {
      // composite types
      if (t.includes('checkbox')) {
        const checked = item.checked ? ' checked' : '';
        rightHtml = `<span class="item-checkbox${checked}"></span>`;
      } else if (t.includes('slider')) {
        const min = item.min || 0, max = item.max || 100, val = item.value || 0;
        const pct = Math.round(((val - min) / (max - min)) * 100);
        rightHtml = `
          <div class="item-slider-wrap">
            <span class="item-scroll-arrow"><i class="fa fa-chevron-left"></i></span>
            <div class="item-slider-bar"><div class="item-slider-fill" style="width:${pct}%"></div></div>
            <span class="item-scroll-arrow"><i class="fa fa-chevron-right"></i></span>
            <span class="item-slider-val">${val}</span>
          </div>`;
      } else if (t.includes('scroll')) {
        const opts = item.options || [];
        const selIdx = Math.max(0, (item.selected || 1) - 1);
        const selLabel = opts[selIdx] ? (opts[selIdx].label || opts[selIdx]) : '';
        rightHtml = `
          <div class="item-scroll-wrap">
            <span class="item-scroll-arrow"><i class="fa fa-chevron-left"></i></span>
            <span class="item-scroll-val">${escHtml(String(selLabel))}</span>
            <span class="item-scroll-arrow"><i class="fa fa-chevron-right"></i></span>
          </div>`;
      }
    }

    el.innerHTML = `
      ${iconHtml}
      <div class="item-body">
        <div class="item-label">${escHtml(item.label || '')}</div>
        ${item.desc ? `<div class="item-desc">${escHtml(item.desc)}</div>` : ''}
      </div>
      <div class="item-right">${rightHtml}</div>
    `;

    menuList.appendChild(el);
  }

  // Scroll active item into view
  requestAnimationFrame(() => {
    const active = menuList.querySelector('.menu-item.is-active');
    if (active) active.scrollIntoView({ block: 'nearest' });
  });
}

function renderTabs() {
  menuTabs.innerHTML = '';
  if (!state.tabs || state.tabs.length === 0) {
    menuTabs.classList.remove('visible');
    return;
  }
  menuTabs.classList.add('visible');
  state.tabs.forEach((name, i) => {
    const btn = document.createElement('div');
    btn.className = 'tab-btn' + (i === state.tabIndex ? ' active' : '');
    btn.textContent = name;
    menuTabs.appendChild(btn);
  });
}

function renderBreadcrumb() {
  if (!state.breadcrumb || state.breadcrumb.length === 0) {
    menuBreadcrumb.classList.remove('visible');
    return;
  }
  menuBreadcrumb.classList.add('visible');
  menuBreadcrumb.textContent = state.breadcrumb.join(' › ');
}

function renderKeybinds() {
  keybindList.innerHTML = '';
  if (!state.keybinds || state.keybinds.length === 0) {
    keybindPanel.classList.remove('visible');
    return;
  }
  keybindPanel.classList.add('visible');
  state.keybinds.forEach(b => {
    const row = document.createElement('div');
    row.className = 'keybind-row';
    row.innerHTML = `<span class="keybind-label">${escHtml(b.label)}</span><span class="keybind-key">${escHtml(b.key)}</span>`;
    keybindList.appendChild(row);
  });
}

function renderSpectators() {
  specList.innerHTML = '';
  if (!state.spectators || state.spectators.length === 0) {
    specPanel.classList.remove('visible');
    return;
  }
  specPanel.classList.add('visible');
  state.spectators.forEach(s => {
    const row = document.createElement('div');
    row.className = 'spec-row';
    row.innerHTML = `<div class="spec-dot"></div>${escHtml(s.label || s)}`;
    specList.appendChild(row);
  });
}

// ══════════════════════════════════════════
// NOTIFICATIONS
// ══════════════════════════════════════════
const NOTIFY_ICONS = {
  success: 'fa fa-check-circle',
  error:   'fa fa-times-circle',
  info:    'fa fa-info-circle',
  warn:    'fa fa-exclamation-triangle',
};

function showNotify(message, type = 'info') {
  type = type || 'info';
  const el = document.createElement('div');
  el.className = `notify ${type}`;
  el.innerHTML = `
    <div class="notify-bar"></div>
    <i class="${NOTIFY_ICONS[type] || NOTIFY_ICONS.info} notify-icon" aria-hidden="true"></i>
    <span class="notify-text">${escHtml(message)}</span>
  `;
  notifyWrap.appendChild(el);
  setTimeout(() => {
    el.classList.add('out');
    setTimeout(() => el.remove(), 350);
  }, 3500);
}

// ══════════════════════════════════════════
// INPUT
// ══════════════════════════════════════════
function showInputUI(data) {
  inputTitle.textContent = data.title || 'Input';
  inputField.value = '';
  inputWrap.classList.add('visible');
  inputField.focus();
}

function hideInputUI() {
  inputWrap.classList.remove('visible');
  inputField.value = '';
  inputField.blur();
}

function setInputText(value, cursor) {
  inputField.value = value || '';
  if (typeof cursor === 'number') {
    try { inputField.setSelectionRange(cursor, cursor); } catch(e) {}
  }
}

// ══════════════════════════════════════════
// MESSAGE HANDLER
// ══════════════════════════════════════════
window.addEventListener('message', function(event) {
  const data = event.data;
  if (!data || !data.action) return;

  switch (data.action) {

    case 'setVisible':
      state.visible = data.visible;
      if (data.visible) {
        menuWrap.classList.add('visible');
      } else {
        menuWrap.classList.remove('visible');
      }
      break;

    case 'setCurrent':
      state.current = data.current || 1;
      if (data.menu !== undefined) {
        state.menu = data.menu || [];
      }
      renderMenu();
      break;

    case 'setTabs':
      state.tabs = data.tabs || [];
      renderTabs();
      break;

    case 'setTabIndex':
      state.tabIndex = data.index || 0;
      renderTabs();
      break;

    case 'resetTabs':
      state.tabs = [];
      state.tabIndex = 0;
      renderTabs();
      break;

    case 'showInput':
      if (data.showInput) {
        showInputUI(data);
      } else {
        hideInputUI();
      }
      break;

    case 'setInputText':
      setInputText(data.value, data.cursor);
      break;

    case 'notify':
      showNotify(data.message, data.type);
      break;

    case 'setMenuColor':
      state.color = { r: data.r, g: data.g, b: data.b };
      setAccent(data.r, data.g, data.b);
      break;

    case 'setMenuPos':
      if (data.x !== undefined) state.menuX = data.x;
      if (data.y !== undefined) state.menuY = data.y;
      setMenuPos(state.menuX, state.menuY);
      break;

    case 'setMenuScale':
      if (data.scale !== undefined) {
        state.menuScale = data.scale;
        setMenuScale(data.scale);
      }
      break;

    case 'getAuthName':
      state.authName = data.authName || '';
      menuAuth.textContent = state.authName;
      break;

    case 'updateKeybinds':
      state.keybinds = data.KeyBinds || [];
      renderKeybinds();
      break;

    case 'updateSpectators':
      state.spectators = data.Spectators || [];
      renderSpectators();
      break;

    // Svelte-compatible aliases
    case 'setMenu':
      state.menu = data.menu || [];
      if (data.current !== undefined) state.current = data.current;
      renderMenu();
      break;
  }
});

// ══════════════════════════════════════════
// UTIL
// ══════════════════════════════════════════
function escHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// ══════════════════════════════════════════
// INIT
// ══════════════════════════════════════════
setMenuPos(state.menuX, state.menuY);
setMenuScale(state.menuScale);
</script>
</body>
